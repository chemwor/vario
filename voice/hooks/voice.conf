# Voice settings, shared by bubo (the Kokoro TTS daemon), the Claude Code hooks and the Vario backend.
# Read fresh on every line spoken, so edits apply right away (BUBO_SOCKET: after `vario voice restart`).

# Kokoro voice and speed. `vario voice` lists the voices; af_ / am_ = American, bf_ / bm_ = British.
VOICE=af_heart
SPEED=1.2

# The name the briefing voice answers to ("Athena online" / "Athena standing by").
VOICE_NAME=Athena

# bubo's unix socket: relative to ~/.claude/hooks, or an absolute path (keep it under ~100 chars).
BUBO_SOCKET=tts.sock

# Where the hooks post events. Change it if Vario runs on another port.
VARIO_URL=http://127.0.0.1:8787

# Music while Claude speaks: pause (Spotify / Apple Music, macOS only) or off. MUSIC_RESUME=on resumes after.
MUSIC=off
MUSIC_RESUME=on

# --- voice input -----------------------------------------------------------------------------------
# Words Whisper should expect, comma-separated (live session names are added automatically).
VOCAB=
# Confidence gate (0..1). Below MIN_DISPATCH_CONF an utterance is logged as rejected and never acted on.
# approve / deny / yes / no / skip / retry, and anything sent to a session, need STRICT_CONF; below it a
# confirm card waits for a spoken "confirm" or a click, and silence never sends it.
MIN_DISPATCH_CONF=0.40
STRICT_CONF=0.70
EXPLICIT_HOLD_S=60
# Confirm card for everything else: how long it waits before sending ("no", "cancel" or Esc stops it).
CONFIRM_HOLD_MS=2000
# One-word commands that skip that wait (the confidence gate still applies to them).
CONFIRM_FAST=yes,no,approve,deny,skip,stop,repeat,details,stats
# Read back what was understood before the wait. on | off
CONFIRM_READBACK=on
# Flag utterances in the Comms pane when Whisper's confidence is below this.
STT_FLAG_BELOW=0.65
